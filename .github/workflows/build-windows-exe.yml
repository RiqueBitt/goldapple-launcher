name: Build Windows EXE (GoldApple Launcher)

# Roda manualmente (aba Actions > Build Windows EXE > Run workflow)
# ou automaticamente a cada push na branch main/master.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - name: Fix node-gyp e Python
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: windows-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependências
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Definir versao do build
        shell: bash
        run: |
          # A versao do package.json fica fixa (herdada do projeto original) e
          # o auto-update do Electron compara essa versao, nao o numero do
          # Release do GitHub. Sem isso, o launcher nunca detecta que ha uma
          # versao mais nova depois do primeiro update.
          VERSION="1.0.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --prefix xmcl-electron-app
          echo "Versao do build: $VERSION"

      - name: Build da UI
        shell: bash
        run: pnpm run --prefix xmcl-keystone-ui build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production

      - name: Build do App (electron-builder)
        shell: bash
        run: pnpm run --prefix xmcl-electron-app build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production
          RELEASE: "true"

      - name: Listar arquivos gerados (debug)
        shell: bash
        run: |
          echo "Conteúdo de xmcl-electron-app/build/output:"
          ls -la xmcl-electron-app/build/output || echo "Pasta não existe"

      # Gera o instalador .exe (NSIS) sem assinatura de código.
      # O Windows Defender/SmartScreen pode alertar "editor desconhecido"
      # até você comprar um certificado de assinatura de código.
      - name: Upload do instalador (artifact do run)
        uses: actions/upload-artifact@v6
        with:
          name: goldapple-launcher-windows-installer
          path: |
            xmcl-electron-app/build/output/*.exe
            xmcl-electron-app/build/output/*.zip
            xmcl-electron-app/build/output/*.blockmap
            xmcl-electron-app/build/output/latest*.yml
          if-no-files-found: error

      # Publica como GitHub Release NO REPOSITORIO DE RELEASES (publico),
      # nao neste repo (que e privado — o codigo-fonte fica so aqui). O
      # electron-updater roda na maquina do usuario sem login nenhum, entao
      # ele so consegue checar/baixar update de um repo publico. Por isso
      # `repository:` aponta pro repo separado e `token:` usa um Personal
      # Access Token proprio (RELEASES_REPO_TOKEN), ja que o
      # secrets.GITHUB_TOKEN automatico so tem permissao dentro DESTE repo.
      #
      # Configuracao necessaria (uma vez so):
      #   1. Crie o repo publico "goldapple-launcher-releases" (vazio, sem
      #      codigo) em github.com/new.
      #   2. Gere um token em Settings > Developer settings > Fine-grained
      #      tokens, com acesso SO a esse repo e permissao "Contents: Read
      #      and write".
      #   3. Adicione esse token como secret neste repo (o privado):
      #      Settings > Secrets and variables > Actions > New repository
      #      secret > nome RELEASES_REPO_TOKEN.
      #
      # É o que faz o botão "Baixar para Windows" do site funcionar,
      # já que ele aponta para /releases/latest desse repo publico.
      # fail_on_unmatched_files garante que, se nada for gerado, o
      # workflow falhe de forma visível em vez de criar uma release vazia.
      - name: Publicar GitHub Release (repo de releases)
        uses: softprops/action-gh-release@v2
        with:
          repository: RiqueBitt/goldapple-launcher-releases
          # Token explicito (nao o secrets.GITHUB_TOKEN automatico) porque
          # esse token so vale dentro deste repo — pra publicar em outro repo
          # precisa de um PAT com permissao la. Veja o comentario acima.
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: v${{ github.run_number }}
          name: GoldApple Launcher build ${{ github.run_number }}
          # Descricao curta que aparece no popup de atualizacao do launcher:
          # a propria mensagem do commit que gerou este build.
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            xmcl-electron-app/build/output/*.exe
            xmcl-electron-app/build/output/*.zip
            xmcl-electron-app/build/output/*.blockmap
            xmcl-electron-app/build/output/latest*.yml
